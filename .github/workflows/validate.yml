name: Validate
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ok-nick/setup-aftman@v0.4.2
        with:
          version: v0.3.0
      - run: aftman install
      - name: Format
        run: stylua --check src tests
      - name: Lint
        run: selene src tests
      - name: Validate structure
        run: bash scripts/validate-structure.sh
      - name: Build Rojo place
        run: mkdir -p build && rojo build default.project.json --output build/RoleplayOS.rbxlx
