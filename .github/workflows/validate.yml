name: Validate
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ok-nick/setup-aftman@v0.4.2
        with:
          version: v0.3.0
      - run: aftman install
      - name: Format
        run: stylua --check src tests scripts/*.luau
      - name: Lint
        run: selene src tests scripts/*.luau
      - name: Contract tests
        run: lune run scripts/run-tests.luau
      - name: Verify failing tests fail CI
        shell: bash
        run: |
          status=0
          output=$(lune run scripts/run-tests.luau --prove-failure 2>&1) || status=$?
          printf '%s\n' "$output"
          test "$status" -ne 0
          grep -q RUNNER_EXPECTED_FAILURE <<< "$output"
      - name: Validate structure
        run: bash scripts/validate-structure.sh
      - name: Build Rojo place
        run: mkdir -p build && rojo build default.project.json --output build/RoleplayOS.rbxlx
      - name: Build acceptance place
        run: rojo build acceptance.project.json --output build/RoleplayOS-Acceptance.rbxlx
      - name: Build real-baseplate deployment
        run: rojo build real-baseplate.project.json --output build/RoleplayOS-RealBaseplate.rbxlx
